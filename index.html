<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="description" content="Volleyball-Übungen zeichnen, animieren und Trainings planen – offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drill Studio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rostock Drill Studio</title>
<style>
/* Layout: top bar / [tool rail | court | inspector] / step strip. Court is the hero; chrome stays quiet. */
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --panel-2:#F6F9FA; --fg:#1E2A33; --muted:#5B6B78; --line:#D8E1EA;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#E2F0F1; --warn:#B06A12; --warn-soft:#FBF3E7;
  --danger:#B3261E; --danger-soft:#FBE9E7; --ok:#1B7F5A; --canvas:#E7ECF0; --shadow:0 6px 24px rgba(20,40,50,.12);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --font-display:"Space Grotesk",var(--font-ui);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1417; --panel:#151D22; --panel-2:#1B252B; --fg:#E6EDF1; --muted:#93A3AE; --line:#2A363E;
  --accent:#36B9C4; --accent-ink:#06282B; --accent-soft:#12353A; --warn:#E0A458; --warn-soft:#2E2416;
  --danger:#F28B82; --danger-soft:#3A1D1B; --ok:#5AC48F; --canvas:#0A0F12; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1417; --panel:#151D22; --panel-2:#1B252B; --fg:#E6EDF1; --muted:#93A3AE; --line:#2A363E;
  --accent:#36B9C4; --accent-ink:#06282B; --accent-soft:#12353A; --warn:#E0A458; --warn-soft:#2E2416;
  --danger:#F28B82; --danger-soft:#3A1D1B; --ok:#5AC48F; --canvas:#0A0F12; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark }

*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--font-ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding-block:8px;max-width:1500px;margin:0 auto}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
.title-in{flex:1 1 220px;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600;font-size:15px}
.title-in:hover,.title-in:focus{border-color:var(--line);background:var(--panel)}
.top .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;display:inline-flex;align-items:center;gap:6px;line-height:1;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.sm{padding:5px 8px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.ex{background:var(--warn-soft);color:var(--warn)}
.dirty{font-size:12px;color:var(--warn);font-weight:600}

/* main */
.main{display:grid;grid-template-columns:60px minmax(0,1fr) 300px;gap:10px;min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:auto}
.tool{border:1px solid transparent;background:transparent;border-radius:9px;width:46px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--muted);padding:0}
.tool svg{width:22px;height:22px;display:block}
.tool:hover{background:var(--panel-2);color:var(--fg)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool .k{font-size:9px;opacity:.7}
.rail hr{width:100%;border:0;border-top:1px solid var(--line);margin:3px 0}

.stage{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:12px;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:6px 6px 34px}
.stage svg.court{max-width:100%;max-height:100%;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;pointer-events:none;opacity:.95}
.stage .playbadge{position:absolute;right:10px;top:8px;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:4px 10px}

.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 6px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.lbl{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea.in{min-height:64px;resize:vertical}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row > .f{flex:1 1 90px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 10px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.quick{display:flex;flex-wrap:wrap;gap:4px}
.quick button{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:4px 7px;font-size:12px;font-weight:700}
.swA,.swB{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.swA{background:#0E7C86}.swB{background:#E07B39}
.empty{color:var(--muted);font-size:13px;line-height:1.5}
.tog{display:flex;align-items:center;gap:8px;font-size:13px}
.tog input{width:16px;height:16px;accent-color:var(--accent)}

/* step strip */
.steps{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.steps .list{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 300px;min-width:0}
.stepchip{border:1px solid var(--line);background:var(--panel-2);border-radius:9px;padding:6px 10px;display:inline-flex;gap:6px;align-items:center;font-weight:600}
.stepchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stepchip .n{font-size:11px;opacity:.7;font-weight:700}
.stepname{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 8px;width:150px}

/* modals, toasts, confirm */
.modal{position:fixed;inset:0;background:rgba(10,20,25,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.dlg header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font-family:var(--font-display);font-size:17px;flex:1}
.dlg .body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.libitem{display:grid;grid-template-columns:1fr auto;gap:6px 10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);cursor:pointer;align-items:center}
.libitem:hover{border-color:var(--accent)}
.libitem .t{font-weight:700}
.libitem .m{font-size:12px;color:var(--muted)}
.libitem .acts{display:flex;gap:4px}
.preview{display:flex;flex-direction:column;align-items:center;gap:10px}
.preview img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:60vh}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);z-index:60;max-width:90vw}
.confirm{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:60;max-width:92vw;flex-wrap:wrap}
.kbd{font-size:11px;color:var(--muted)}
.kbd b{font-weight:700;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel-2)}

/* planner */
.app.plan .main,.app.plan .steps,.app.plan .studio-only{display:none}
.planner{display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px;min-height:0}
.pform{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.pout{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;min-width:0}
.quick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pstats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);flex:1 1 110px}
.stat b{display:block;font-family:var(--font-display);font-size:19px;color:var(--fg);font-variant-numeric:tabular-nums}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px}
.blk .mini svg{width:100%;height:auto;display:block;border-radius:8px;background:var(--canvas)}
.blk .bi{display:flex;flex-direction:column;gap:6px;min-width:0}
.blk h3{margin:0;font-family:var(--font-display);font-size:16px;text-wrap:balance}
.blk p{margin:0;font-size:13px;line-height:1.45}
.blk .time{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.roles{display:flex;flex-wrap:wrap;gap:4px}
.rc{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;background:var(--panel-2)}
.rc b{margin-right:4px;color:var(--accent)}
.bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b1{background:var(--accent)} .bar .b2{background:var(--muted)} .bar .b3{background:var(--warn)}

@media (max-width:900px){
  .planner{grid-template-columns:1fr}
  .pform,.pout{overflow:visible}
  .blk{grid-template-columns:104px minmax(0,1fr)}
  html,body{height:auto}
  .app{height:auto;grid-template-rows:auto auto auto auto}
  .main{grid-template-columns:1fr;grid-template-rows:auto auto auto}
  .rail{flex-direction:row;flex-wrap:nowrap;overflow-x:auto}
  .rail hr{width:1px;height:36px;border-top:0;border-left:1px solid var(--line);margin:0 2px;align-self:center}
  .stage{height:68vh}
  .side{max-height:none}
  .pane{overflow:visible}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="dot"></span><span>Rostock Drill Studio</span></div>
    <input id="title" class="title-in" type="text" maxlength="80" placeholder="Übungstitel" aria-label="Titel">
    <span id="dirty" class="dirty" hidden>●</span>
    <div class="grp">
      <button class="btn primary" id="bPlan">Planer</button>
      <button class="btn" id="bUndo" title="Rückgängig (Ctrl+Z)">↶</button>
      <button class="btn" id="bRedo" title="Wiederholen (Ctrl+Y)">↷</button>
      <button class="btn" id="bLib" data-i18n="lib">Bibliothek</button>
      <button class="btn" id="bNew" data-i18n="new">Neu</button>
      <button class="btn primary" id="bSave" data-i18n="save">Speichern</button>
      <button class="btn" id="bExport" data-i18n="export">Export</button>
      <button class="btn" id="bHelp" title="Hilfe">?</button>
      <button class="btn" id="bLang" title="Sprache / language">DE · EN</button>
    </div>
  </header>

  <div class="main">
    <nav class="rail" id="rail" aria-label="Werkzeuge">
      <button class="tool on" data-tool="select" title="Auswählen / bewegen (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 8-6 2-2 6z"/></svg><span data-i18n="t_select">Wählen</span></button>
      <hr>
      <button class="tool" data-tool="playerA" title="Spieler Team A (1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#0E7C86"/></svg><span data-i18n="t_pa">Team A</span></button>
      <button class="tool" data-tool="playerB" title="Spieler Team B (2)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#E07B39"/></svg><span data-i18n="t_pb">Team B</span></button>
      <button class="tool" data-tool="ball" title="Ball (B)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="#F2C94C" stroke="#8A6D1B" stroke-width="1.5"/><path d="M6 12q6-4 12 0" fill="none" stroke="#8A6D1B"/></svg><span data-i18n="t_ball">Ball</span></button>
      <button class="tool" data-tool="cone" title="Hütchen (C)"><svg viewBox="0 0 24 24"><path d="M12 4l6 15H6z" fill="#E07B39" stroke="#2B3A4A"/></svg><span data-i18n="t_cone">Hütchen</span></button>
      <button class="tool" data-tool="coach" title="Trainer (T)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4" fill="#2B3A4A"/><text x="12" y="16.5" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">T</text></svg><span data-i18n="t_coach">Trainer</span></button>
      <button class="tool" data-tool="box" title="Kasten (K)"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="10" rx="2" fill="#B9C6D3" stroke="#2B3A4A"/></svg><span data-i18n="t_box">Kasten</span></button>
      <button class="tool" data-tool="target" title="Zielpunkt"><svg viewBox="0 0 24 24" fill="none" stroke="#1B7F5A" stroke-width="2"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.2" fill="#1B7F5A"/></svg><span data-i18n="t_target">Ziel</span></button>
      <button class="tool" data-tool="zone" title="Zone (Z)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2" fill="#1B7F5A" fill-opacity=".18" stroke="#1B7F5A" stroke-dasharray="4 3" stroke-width="1.8"/></svg><span data-i18n="t_zone">Zone</span></button>
      <button class="tool" data-tool="text" title="Text (X)"><svg viewBox="0 0 24 24"><text x="12" y="17" text-anchor="middle" font-size="15" font-weight="800" fill="currentColor">Aa</text></svg><span data-i18n="t_text">Text</span></button>
      <hr>
      <button class="tool" data-tool="run" title="Laufweg (R)"><svg viewBox="0 0 24 24" fill="none" stroke="#3D5A80" stroke-width="2.2"><path d="M4 18L17 7" stroke-dasharray="4 3"/><path d="M12 6h6v6" /></svg><span data-i18n="t_run">Laufweg</span></button>
      <button class="tool" data-tool="ballpath" title="Ballweg / Angriff (S)"><svg viewBox="0 0 24 24" fill="none" stroke="#C1121F" stroke-width="2.4"><path d="M4 18L17 7"/><path d="M12 6h6v6"/></svg><span data-i18n="t_bp">Ballweg</span></button>
      <button class="tool" data-tool="pass" title="Zuspiel / Pass (P)"><svg viewBox="0 0 24 24" fill="none" stroke="#B8901C" stroke-width="2.4"><path d="M4 17q8-14 15-5" stroke-dasharray="2 3"/><path d="M15 6l4 6-6 1"/></svg><span data-i18n="t_pass">Zuspiel</span></button>
    </nav>

    <section class="stage" id="stage">
      <svg class="court" id="svg" viewBox="0 0 350 640" xmlns="http://www.w3.org/2000/svg" aria-label="Spielfeld"></svg>
      <div class="hint" id="hint"></div>
      <div class="playbadge" id="playbadge" hidden>▶</div>
    </section>

    <aside class="side">
      <div class="tabs">
        <button id="tabEl" class="on" data-i18n="tab_el">Element</button>
        <button id="tabDr" data-i18n="tab_dr">Übung</button>
      </div>
      <div class="pane" id="paneEl"></div>
      <div class="pane" id="paneDr" hidden>
        <div class="row">
          <div class="f"><label for="cat" data-i18n="cat">Kategorie</label>
            <select id="cat" class="in">
              <option value="Aufschlag">Aufschlag</option><option value="Annahme">Annahme</option><option value="Angriff">Angriff</option>
              <option value="Block">Block</option><option value="Abwehr">Abwehr</option><option value="Zuspiel">Zuspiel</option><option value="Spiel">Spiel</option><option value="Aufwärmen">Aufwärmen</option>
            </select></div>
          <div class="f"><label for="dur" data-i18n="dur">Dauer</label><input id="dur" class="in" placeholder="15 min"></div>
          <div class="f"><label for="pl" data-i18n="players">Spieler</label><input id="pl" class="in" placeholder="8–18"></div>
        </div>
        <div class="f"><label for="nOrg" data-i18n="org">Organisation</label><textarea id="nOrg" class="in"></textarea></div>
        <div class="f"><label for="nCoach" data-i18n="coach">Coaching-Punkte</label><textarea id="nCoach" class="in"></textarea></div>
        <div class="f"><label for="nProg" data-i18n="prog">Progression</label><textarea id="nProg" class="in"></textarea></div>
        <div class="f"><span class="lbl" data-i18n="court">Feld</span>
          <div class="row">
            <div class="seg" id="segOrient"><button data-v="v" class="on" data-i18n="vert">Hochkant</button><button data-v="h" data-i18n="horiz">Quer</button></div>
            <div class="seg" id="segHalf"><button data-v="0" class="on" data-i18n="full">Ganz</button><button data-v="1" data-i18n="half">Halb</button></div>
          </div>
          <label class="tog"><input type="checkbox" id="tZones" checked><span data-i18n="zones">Zonen 1–6 anzeigen</span></label>
          <label class="tog"><input type="checkbox" id="tSnap" checked><span data-i18n="snap">Am Raster einrasten</span></label>
        </div>
      </div>
    </aside>
  </div>

  <footer class="steps">
    <div class="list" id="stepList"></div>
    <input id="stepName" class="stepname" maxlength="40" placeholder="Schrittname">
    <button class="btn sm" id="bStepAdd" title="Neuer Schritt (Kopie)">＋ <span data-i18n="step">Schritt</span></button>
    <button class="btn sm" id="bStepL" title="nach links">◀</button>
    <button class="btn sm" id="bStepR" title="nach rechts">▶</button>
    <button class="btn sm danger" id="bStepDel" title="Schritt löschen">🗑</button>
    <span style="flex:0 0 8px"></span>
    <button class="btn sm primary" id="bPlay">▶ <span data-i18n="play">Abspielen</span></button>
    <select id="speed" class="in" style="width:auto;padding:5px 6px"><option value="0.6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select>
    <label class="tog"><input type="checkbox" id="loop"><span data-i18n="loop">Schleife</span></label>
  </footer>

  <section class="planner" id="planner" hidden>
    <div class="pform">
      <div class="f"><label for="plN" data-i18n="p_players">Spieler heute</label>
        <div class="row"><input id="plN" class="in" type="number" min="8" max="18" value="16" style="width:76px"><input id="plNr" type="range" min="8" max="18" value="16" style="flex:1;min-width:0" aria-label="Spieler"></div></div>

  }
};
let LANG = 'de';
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.de[k] || k;
function applyI18n() {
  $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#title').placeholder = t('untitled');
  $('#stepName').placeholder = t('step');
  $('#helpBody').innerHTML = t('help_html');

}

/* ---------------- constants & state ---------------- */
const COL = { a: '#0E7C86', b: '#E07B39', run: '#3D5A80', ball: '#C1121F', pass: '#B8901C', zone: '#1B7F5A', stroke: '#2B3A4A',
  court: '#E8F0F7', att: '#DBE8F4', ring: '#8A3B12', box: '#B9C6D3', ballfill: '#F2C94C', ballstroke: '#8A6D1B', coach: '#2B3A4A', faint: '#B9C6D3' };
const S = 30, MX = 40, MY = 50;
const VB = { v: { full: [0, 0, 350, 640], half: [0, 250, 350, 390] }, h: { full: [0, 0, 640, 350], half: [0, 0, 400, 350] } };
const ORDER = { zone: 0, box: 1, arrow: 2, cone: 3, target: 4, player: 5, ball: 6, coach: 7, text: 8 };
const CATS = ['Aufschlag', 'Annahme', 'Angriff', 'Block', 'Abwehr', 'Zuspiel', 'Spiel', 'Aufwärmen'];

const state = { drill: null, step: 0, tool: 'select', sel: null, snap: true, undo: [], redo: [], playing: false, dirty: false, lib: [] };
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } }
};
function newDrill(title) {
  return { id: uid(), title: title || '', category: 'Block', duration: '', players: '', notes: { org: '', coach: '', prog: '' },
    orient: 'v', half: false, zones: true, steps: [{ name: t('step') + ' 1', els: [] }], createdAt: Date.now(), updatedAt: Date.now() };
}
const cur = () => state.drill.steps[state.step];
const findEl = id => cur().els.find(e => e.id === id);

/* ---------------- geometry ---------------- */
function P(X, Y, d) { d = d || state.drill; return d.orient === 'v' ? [MX + S * X, MY + S * Y] : [MY + S * (18 - Y), MX + S * X]; }
function unP(px, py) { return state.drill.orient === 'v' ? [(px - MX) / S, (py - MY) / S] : [(py - MX) / S, 18 - (px - MY) / S]; }
function rectP(X1, Y1, X2, Y2, d) {
  const a = P(X1, Y1, d), b = P(X2, Y2, d);
  const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
  return [x, y, Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])];
}
const f1 = n => Math.round(n * 10) / 10;
const HALO = 'stroke="#fff" stroke-width="3.4" stroke-linejoin="round" paint-order="stroke"';

/* ---------------- court ---------------- */
function courtSVG(d) {
  const p = [];
  const [cx, cy, cw, ch] = rectP(0, 0, 9, 18, d);
  p.push(`<rect x="${cx}" y="${cy}" width="${cw}" height="${ch}" fill="${COL.court}" stroke="${COL.stroke}" stroke-width="2"/>`);
  const [ax, ay, aw, ah] = rectP(0, 6, 9, 12, d);
  p.push(`<rect x="${ax}" y="${ay}" width="${aw}" height="${ah}" fill="${COL.att}"/>`);
  for (const Y of [6, 12]) { const a = P(0, Y, d), b = P(9, Y, d); p.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${COL.stroke}" stroke-width="1.2"/>`); }
  if (d.zones) {
    for (const X of [3, 6]) { const a = P(X, 0, d), b = P(X, 18, d); p.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${COL.stroke}" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 4"/>`); }
    const own = { 10.5: [4, 3, 2], 15: [5, 6, 1] }, opp = { 7.5: [2, 3, 4], 3: [1, 6, 5] };
    for (const [grp, col] of [[own, COL.a], [opp, COL.b]]) for (const Y in grp) grp[Y].forEach((z, i) => {
      const [x, y] = P(1.5 + 3 * i, +Y, d);
      p.push(`<text x="${x}" y="${y + 15}" text-anchor="middle" font-size="44" font-weight="800" fill="${col}" opacity=".11">${z}</text>`);
    });
  }
  const n1 = P(-0.53, 9, d), n2 = P(9.53, 9, d);
  p.push(`<line x1="${n1[0]}" y1="${n1[1]}" x2="${n2[0]}" y2="${n2[1]}" stroke="${COL.stroke}" stroke-width="3.4"/>`);
  for (let X = 0; X <= 9.001; X += 0.5) { const a = P(X, 8.87, d), b = P(X, 9.13, d); p.push(`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${COL.stroke}" stroke-width=".7"/>`); }
  p.push(`<circle cx="${n1[0]}" cy="${n1[1]}" r="2.5" fill="${COL.stroke}"/><circle cx="${n2[0]}" cy="${n2[1]}" r="2.5" fill="${COL.stroke}"/>`);
  return p.join('');
}

/* ---------------- elements ---------------- */
function arrowGeom(e, d) {
  const p1 = P(e.x, e.y, d), p2 = P(e.x2, e.y2, d), c = e.c ? P(e.c.x, e.c.y, d) : null;
  const from = c || p1; let dx = p2[0] - from[0], dy = p2[1] - from[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
  const hl = 9, tip = p2, base = [p2[0] - dx * hl, p2[1] - dy * hl];
  const head = `M${tip[0]},${tip[1]} L${base[0] - dy * 4.5},${base[1] + dx * 4.5} L${base[0] + dy * 4.5},${base[1] - dx * 4.5} Z`;
  const end = [p2[0] - dx * hl * .7, p2[1] - dy * hl * .7];
  const path = c ? `M${p1[0]},${p1[1]} Q${c[0]},${c[1]} ${end[0]},${end[1]}` : `M${p1[0]},${p1[1]} L${end[0]},${end[1]}`;
  const mid = c ? [.25 * p1[0] + .5 * c[0] + .25 * p2[0], .25 * p1[1] + .5 * c[1] + .25 * p2[1]] : [(p1[0] + p2[0]) / 2, (p1[1] + p2[1]) / 2];
  return { p1, p2, c, path, head, mid };
}
function elSVG(e, d, inter) {
  const id = inter ? ` data-id="${e.id}"` : '';
  const g = inner => `<g${id}>${inner}</g>`;
  if (e.t === 'player') {
    const [x, y] = P(e.x, e.y, d), lab = e.label || '', fs = lab.length >= 3 ? 9.5 : lab.length === 2 ? 11 : 12;
    return g(`<circle cx="${x}" cy="${y}" r="13" fill="${COL[e.team] || COL.a}" stroke="${e.ring ? COL.ring : '#fff'}" stroke-width="${e.ring ? 2.8 : 1.6}"/>` +
      `<text x="${x}" y="${y + 4.2}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff">${esc(lab)}</text>`);
  }
  if (e.t === 'ball') { const [x, y] = P(e.x, e.y, d); return g(`<circle cx="${x}" cy="${y}" r="6.5" fill="${COL.ballfill}" stroke="${COL.ballstroke}" stroke-width="1.2"/><path d="M${x - 6},${y} Q${x},${y - 4} ${x + 6},${y}" fill="none" stroke="${COL.ballstroke}" stroke-width=".8"/>`); }
  if (e.t === 'cone') { const [x, y] = P(e.x, e.y, d); return g(`<path d="M${x},${y - 7} L${x - 6},${y + 5} L${x + 6},${y + 5} Z" fill="${COL.b}" stroke="${COL.stroke}" stroke-width=".7"/>`); }
  if (e.t === 'coach') { const [x, y] = P(e.x, e.y, d); return g(`<rect x="${x - 11}" y="${y - 11}" width="22" height="22" rx="5" fill="${COL.coach}" stroke="#fff" stroke-width="1.4"/><text x="${x}" y="${y + 4.2}" text-anchor="middle" font-size="11.5" font-weight="800" fill="#fff">${esc(e.label || 'T')}</text>`); }
  if (e.t === 'box') { const [x, y, w, h] = rectP(e.x - .5, e.y - .3, e.x + .5, e.y + .3, d); return g(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${COL.box}" stroke="${COL.stroke}" stroke-width="1.2"/><text x="${x + w / 2}" y="${y + h / 2 + 3.5}" text-anchor="middle" font-size="9" font-weight="700" fill="${COL.stroke}">K</text>`); }
  if (e.t === 'target') { const [x, y] = P(e.x, e.y, d); return g(`<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="${COL.zone}" stroke-width="2" stroke-dasharray="3 3"/><circle cx="${x}" cy="${y}" r="6" fill="none" stroke="${COL.zone}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="2.4" fill="${COL.zone}"/>` + (e.label ? `<text x="${x}" y="${y - 16}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${COL.zone}" ${HALO}>${esc(e.label)}</text>` : '')); }
  if (e.t === 'zone') { const [x, y, w, h] = rectP(e.x, e.y, e.x + e.w, e.y + e.h, d); return g(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${COL.zone}" fill-opacity=".12" stroke="${COL.zone}" stroke-width="1.8" stroke-dasharray="5 4"/>` + (e.label ? `<text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="${COL.zone}" ${HALO}>${esc(e.label)}</text>` : '')); }
  if (e.t === 'text') { const [x, y] = P(e.x, e.y, d); return g(`<text x="${x}" y="${y + (e.size || 11) * .35}" text-anchor="middle" font-size="${e.size || 11}" font-weight="700" fill="${COL.stroke}" ${HALO}>${esc(e.txt || '')}</text>`); }
  if (e.t === 'arrow') {

    roles = [R('Team A', 'Team A', 6, 6, { pos: SIX }), R('Team B', 'Team B', 6, 6, { team: 'b', pos: B6 })].concat(j ? [R('Aufschlag-Joker', 'Serving jokers', j, j, { pos: [[9.9, 17.5], [-0.9, 0.5]], lab: 'J', hold: 30 })] : []);
    org = { de: j ? 'Der Joker schlägt für sein Team auf und bleibt im Feld; dafür geht der Spieler von Position 1 raus und wird neuer Joker.' : 'Normale Aufstellung, schnelle Aufschläge – der Ball ist sofort wieder im Spiel.', en: j ? 'The joker serves for the team and stays on court; the player from position 1 steps out and becomes the next joker.' : 'Normal line-up, quick serves – the ball is back in play at once.' };
    rot = { de: j ? 'Wechsel bei jeder Rotation, Pause höchstens eine Rotation (rund 30 Sekunden).' : 'Normale Rotation.', en: j ? 'Switch at every rotation; the pause is at most one rotation (about 30 seconds).' : 'Normal rotation.' };
  } else {
    const k = Math.floor(n / 2), neutral = n - 2 * k;
    name = { de: `${k} gegen ${k}` + (neutral ? ' mit neutralem Zuspieler' : ''), en: `${k} v ${k}` + (neutral ? ' with a neutral setter' : '') };
    roles = [R('Team A', 'Team A', k, k, { pos: SIX }), R('Team B', 'Team B', k, k, { team: 'b', pos: B6 })].concat(neutral ? [R('Neutraler Zuspieler', 'Neutral setter', 1, 1, { pos: [[9.6, 9]], lab: 'Z', ring: 1 })] : []);
    org = { de: 'Kleines Spiel auf ganzem Feld' + (neutral ? '; der neutrale Zuspieler läuft unter dem Netz durch und stellt für beide Seiten.' : '.'), en: 'Small-sided game on the full court' + (neutral ? '; the neutral setter runs under the net and sets for both sides.' : '.') };
    rot = { de: 'Alle spielen durch, Positionen rotieren bei jedem Aufschlagwechsel.', en: 'Everyone plays throughout; rotate positions at every side-out.' };
  }
  const al = { roles: roles.map(r => ({ r, c: r.min, max: r.max })), side: 0 };
  return { dr: { id: 'game', cats: ['Spiel'], name, org, rot, cue: rule, roles, st: [], ph: PH.game }, al };
}

function buildPlan() {
  const rnd = rng(PL.seed), used = new Set(), blocks = [], n = PL.n;
  const pick = cat => {
    let c = DRILLS.filter(d => d.cats.includes(cat) && n >= d.min && (!d.box || PL.box));
    const fresh = c.filter(d => !used.has(d.id)); if (fresh.length) c = fresh; if (!c.length) return null;
    let best = null, bs = -1e9;
    for (const d of c) { const al = alloc(d, n); if (!al) continue; const s = stats(al), sc = -s.side * 5 - s.wait / 8 + (PL.run && d.run ? 2.5 : 0) + rnd() * 3; if (sc > bs) { bs = sc; best = d; } }
    if (best) used.add(best.id); return best;
  };
  const add = (dr, min, cat) => { if (!dr || min <= 0) return; const al = alloc(dr, n); blocks.push({ dr, al, min, cat, st: stats(al) }); };
  const w1 = PL.tech >= 75 ? 7 : 5, w2 = PL.tech >= 75 ? 8 : 7;
  add(pick('warmrun'), w1, 'warm'); add(pick('warmball'), w2, 'warm');
  const rest = PL.tech - w1 - w2, F = PL.focus.length ? PL.focus : ['Aufschlag', 'Annahme', 'Angriff'], units = Math.floor(rest / 5), extra = rest - units * 5;
  F.forEach((c, i) => {
    const m = (Math.floor(units / F.length) + (i < units % F.length ? 1 : 0)) * 5 + (i === 0 ? extra : 0), d1 = pick(c); if (!d1) return;
    const d2 = m >= 25 ? pick(c) : null;
    if (d2 && d2 !== d1) { const pair = [d1, d2].sort((x, y) => x.lvl - y.lvl), a = Math.round(m * 0.45 / 5) * 5; add(pair[0], a, c); add(pair[1], m - a, c); } else add(d1, m, c);
  });
  if (PL.game > 0) { const g = gameDrill(n, F[0]); blocks.push({ dr: g.dr, al: g.al, min: PL.game, cat: 'Spiel', st: stats(g.al) }); }
  let s = 0; blocks.forEach(b => { b.start = s; s += b.min; });
  PLAN = blocks; LS.set('vds.plan.v1', PL); renderPlan();
}
function swapBlock(i) {
  const b = PLAN[i]; if (!b || b.cat === 'Spiel') return;
  const cat = b.cat === 'warm' ? b.dr.cats[0] : b.cat, inPlan = new Set(PLAN.map(x => x.dr.id));
  let c = DRILLS.filter(d => d.cats.includes(cat) && d !== b.dr && PL.n >= d.min && (!d.box || PL.box) && alloc(d, PL.n));
  const fresh = c.filter(d => !inPlan.has(d.id)); if (fresh.length) c = fresh; if (!c.length) return toast(t('p_none'));
  const d = c[Math.floor(Math.random() * c.length)], al = alloc(d, PL.n); PLAN[i] = Object.assign({}, b, { dr: d, al, st: stats(al) }); renderPlan();
}

const miniSVG = b => `<svg viewBox="0 0 350 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">${sceneBody(sceneEls(b.dr, b.al, PL.n), MINI_D, false, null)}</svg>`;
const rolesOf = b => b.al.roles.map(({ r, c }) => [c, L(r)]).concat(b.al.side ? [[b.al.side, t('p_side')]] : []);
const actLine = b => `${t('p_ball')} ${b.st.ball} · ${t('p_move')} ${b.st.move} · ${t('p_side')} ${b.st.side} · ${t('p_noidle')} 0 · ${t('p_wait')} ~${b.st.wait} s`;
function renderPlan() {
  const out = $('#plOut'); if (!PLAN.length) { out.innerHTML = `<p class="empty">${t('p_none')}</p>`; return; }
  const total = PLAN.reduce((s, b) => s + b.min, 0), maxWait = Math.max(...PLAN.map(b => b.st.wait)), side = Math.max(...PLAN.map(b => b.st.side));
  let h = `<div class="pstats"><div class="stat"><b>${PL.n}</b>${t('p_players_s')}</div><div class="stat"><b>${total} min</b>${PLAN.length} ${LANG === 'en' ? 'blocks' : 'Blöcke'}</div><div class="stat"><b>0</b>${t('p_noidle')}</div><div class="stat"><b>~${maxWait} s</b>${t('p_maxwait')}</div><div class="stat"><b>${side}</b>${t('p_side')} (max.)</div></div>`;
  h += PLAN.map((b, i) => {
    const n = PL.n, pc = v => (100 * v / n).toFixed(1);
    return `<article class="blk"><div class="mini">${miniSVG(b)}<div class="cap kbd"></div><button class="btn sm primary" data-play="${i}" style="margin-top:6px;width:100%;justify-content:center">${t('p_show')}</button></div><div class="bi">
      <div class="row"><span class="time">${b.start}′–${b.start + b.min}′ · ${b.min} min</span><span class="chip">${esc(catName(b.cat))}</span>${b.dr.run ? `<span class="chip ex">${t('p_runchip')}</span>` : ''}</div>
      <h3>${esc(L(b.dr.name))}</h3>
      <div class="roles">${rolesOf(b).map(([c, l]) => `<span class="rc"><b>${c}</b>${esc(l)}</span>`).join('')}</div>
      <div class="bar"><i class="b1" style="width:${pc(b.st.ball)}%"></i><i class="b2" style="width:${pc(b.st.move)}%"></i><i class="b3" style="width:${pc(b.st.side)}%"></i></div>
      <div class="kbd">${actLine(b)}</div>
      <p><b>${t('p_flow')}:</b> ${esc(L(b.dr.org))}</p><p><b>${t('p_rot')}:</b> ${esc(L(b.dr.rot))}</p><p><b>${t('p_cue')}:</b> ${esc(L(b.dr.cue))}</p>
      ${b.st.side ? `<p class="kbd">${t('p_sidehint')}</p>` : ''}
      <div class="row"><button class="btn sm" data-open="${i}">${t('p_open')}</button>${b.cat !== 'Spiel' ? `<button class="btn sm" data-swap="${i}">${t('p_swap')}</button>` : ''}</div>
    </div></article>`;
  }).join('');
  out.innerHTML = h;
}
function blockToDrill(b) {
  const d = newDrill(L(b.dr.name)); d.category = CATS.includes(b.cat) ? b.cat : (b.cat === 'warm' ? 'Aufwärmen' : 'Spiel'); d.duration = b.min + ' min'; d.players = String(PL.n); d.zones = false;
  d.notes = { org: L(b.dr.org) + '\n' + rolesOf(b).map(([c, l]) => c + '× ' + l).join(' · '), coach: L(b.dr.cue), prog: L(b.dr.rot) };
  d.steps = buildSteps(b.dr, b.al, PL.n); return d;
}
function planText() {
  const total = PLAN.reduce((s, b) => s + b.min, 0);
  return `${t('p_plan')} · ${PL.n} ${t('p_players_s')} · ${total} min\n\n` + PLAN.map(b => `${b.start}′–${b.start + b.min}′  ${L(b.dr.name)} [${catName(b.cat)}]\n  ${rolesOf(b).map(([c, l]) => c + '× ' + l).join(' · ')}\n  ${actLine(b)}\n  ${t('p_flow')}: ${L(b.dr.org)}\n  ${t('p_rot')}: ${L(b.dr.rot)}\n  ${t('p_cue')}: ${L(b.dr.cue)}`).join('\n\n');
}
function planHTML() {
  const total = PLAN.reduce((s, b) => s + b.min, 0);
  return `<!doctype html><html lang="${LANG}"><head><meta charset="utf-8"><title>${t('p_plan')} ${PL.n}</title><style>body{font:13px/1.45 Helvetica,Arial,sans-serif;color:#1E2A33;max-width:900px;margin:24px auto;padding:0 16px}h1{font-size:20px;margin:0 0 12px}.b{display:grid;grid-template-columns:140px 1fr;gap:14px;border:1px solid #D8E1EA;border-radius:10px;padding:10px;margin:0 0 10px;break-inside:avoid}svg{width:100%;height:auto}.t{color:#5B6B78;font-weight:700;font-size:12px}h2{margin:2px 0 6px;font-size:15px}p{margin:0 0 5px}.r span{display:inline-block;border:1px solid #D8E1EA;border-radius:99px;padding:1px 8px;margin:0 4px 4px 0;font-size:12px}.a{color:#5B6B78;font-size:12px}@media print{body{margin:0;max-width:none}}</style></head><body><h1>${t('p_plan')} · ${PL.n} ${t('p_players_s')} · ${total} min</h1>` +
    PLAN.map(b => `<div class="b"><div>${miniSVG(b)}</div><div><div class="t">${b.start}′–${b.start + b.min}′ · ${b.min} min · ${esc(catName(b.cat))}</div><h2>${esc(L(b.dr.name))}</h2><div class="r">${rolesOf(b).map(([c, l]) => `<span><b>${c}</b> ${esc(l)}</span>`).join('')}</div><p class="a">${actLine(b)}</p><p><b>${t('p_flow')}:</b> ${esc(L(b.dr.org))}</p><p><b>${t('p_rot')}:</b> ${esc(L(b.dr.rot))}</p><p><b>${t('p_cue')}:</b> ${esc(L(b.dr.cue))}</p></div></div>`).join('') + '</body></html>';
}

/* ---------------- planner: wiring ---------------- */
function syncForm() {
  $('#plN').value = PL.n; $('#plNr').value = PL.n; $('#plTech').value = PL.tech; $('#plGame').value = PL.game; $('#plRun').checked = !!PL.run; $('#plBox').checked = !!PL.box;
  $('#plFocus').innerHTML = FOCI.map(f => `<button data-v="${f}" class="${PL.focus.includes(f) ? 'on' : ''}">${esc(catName(f))}</button>`).join('');
}
function setN(v) { PL.n = Math.max(8, Math.min(18, Math.round(+v) || 16)); $('#plN').value = PL.n; $('#plNr').value = PL.n; buildPlan(); }
$('#plN').addEventListener('change', e => setN(e.target.value)); $('#plNr').addEventListener('input', e => setN(e.target.value));
$('#plTech').addEventListener('change', e => { PL.tech = +e.target.value; buildPlan(); }); $('#plGame').addEventListener('change', e => { PL.game = +e.target.value; buildPlan(); });
$('#plRun').addEventListener('change', e => { PL.run = e.target.checked; buildPlan(); }); $('#plBox').addEventListener('change', e => { PL.box = e.target.checked; buildPlan(); });
$('#plFocus').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const v = b.dataset.v, i = PL.focus.indexOf(v); if (i >= 0) PL.focus.splice(i, 1); else { if (PL.focus.length >= 3) PL.focus.shift(); PL.focus.push(v); } syncForm(); buildPlan(); });
$('#plGo').addEventListener('click', buildPlan); $('#plDice').addEventListener('click', () => { PL.seed = (PL.seed * 31 + 17) % 100003; buildPlan(); });
$('#plCopy').addEventListener('click', () => copyText(planText()));
$('#plHtml').addEventListener('click', async () => { if (await saveFile(`trainingsplan-${PL.n}-spieler.html`, planHTML()) === 'none') toast(t('p_nodl')); });
$('#plToLib').addEventListener('click', () => { PLAN.forEach(b => state.lib.unshift(normalize(blockToDrill(b)))); persistLib(); toast(PLAN.length + ' ' + t('p_added')); });
$('#plOut').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), s = e.target.closest('[data-swap]');
  const pl = e.target.closest('[data-play]'); if (pl) return miniPlay(+pl.dataset.play);
  miniStop();
  if (s) return swapBlock(+s.dataset.swap);
  if (o) { const d = blockToDrill(PLAN[+o.dataset.open]), go = () => { openDrill(d); state.dirty = true; $('#dirty').hidden = false; setView('studio'); if (d.steps.length > 1) startPlay(); }; state.dirty ? confirmBar(t('confirm_new'), go) : go(); }
});
let VIEW = 'studio';
function setView(v) {
  VIEW = v === 'plan' ? 'plan' : 'studio'; if (VIEW === 'plan' && state.playing) stopPlay();
  $('#app').classList.toggle('plan', VIEW === 'plan'); $('#planner').hidden = VIEW !== 'plan'; $('#bPlan').textContent = VIEW === 'plan' ? t('studio') : t('planner');
  if (VIEW === 'plan') { syncForm(); if (!PLAN.length) buildPlan(); else renderPlan(); }
  const want = VIEW === 'plan' ? '#planer' : '#studio'; try { if (location.hash !== want && (VIEW === 'plan' || location.hash)) location.hash = want; } catch (e) { }
}
$('#bPlan').addEventListener('click', () => setView(VIEW === 'plan' ? 'studio' : 'plan'));
$('#bLang').addEventListener('click', () => { $('#bPlan').textContent = VIEW === 'plan' ? t('studio') : t('planner'); if (VIEW === 'plan') { syncForm(); renderPlan(); } });
window.addEventListener('hashchange', () => { const p = location.hash === '#planer'; if (p !== (VIEW === 'plan')) setView(p ? 'plan' : 'studio'); });
['title', 'dirty', 'bUndo', 'bRedo', 'bSave', 'bExport', 'bNew'].forEach(id => $('#' + id).classList.add('studio-only'));
applyI18n(); setView(location.hash === '#planer' ? 'plan' : 'studio');
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
